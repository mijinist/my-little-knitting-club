<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Project | Soft Stitch Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body data-page="crochet">
  <div class="site-shell">
    <header class="hero">
      <div class="hero__image">
        <div class="hero__sparkle hero__sparkle--one"></div>
        <div class="hero__sparkle hero__sparkle--two"></div>
        <div class="logo-wrap logo-wrap--hero">
          <img src="logo.png" alt="Soft Stitch Portfolio logo" class="site-logo" onerror="this.parentElement.classList.add('logo-wrap--missing')">
          <span class="logo-fallback">Soft Stitch</span>
        </div>
      </div>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="knitting-project.html">Knitting Project</a>
        <a href="crochet-project.html" aria-current="page">Crochet Project</a>
        <a href="news.html">News</a>

    <main class="single-layout">
      <section class="content">
        <section class="panel thumbnail-board" aria-label="Crochet project thumbnails" data-project-board>
          <div class="thumbnail-grid">
            <a class="thumbnail-card thumbnail-card--duo" id="lily" href="#lily" data-project-card>
              <img src="/c1-1.jpg" alt="lily of the valley">
              <img src="/c1-2.jpg" alt="">
              <h2>lily of the valley</h2>
            </a>
            <a class="thumbnail-card" id="eyeball" href="#eyeball" data-project-card>
              <img src="/c2.jpg" alt="eyeball">

            </a>
            <a class="thumbnail-card" id="walking-mushroom" href="#walking-mushroom" data-project-card>

              <h2>walking mushroom</h2>
            </a>
            <a class="thumbnail-card" id="star-coaster" href="#star-coaster" data-project-card>
              <img src="/c4.jpg" alt="star coaster">
              <h2>star coaster</h2>
            </a>
            <a class="thumbnail-card" id="summer-mesh-bagpack" href="#summer-mesh-bagpack" data-project-card>
              <img src="/c5.jpg" alt="summer mesh bagpack">
              <h2>summer mesh bagpack</h2>
            </a>
            <a class="thumbnail-card" id="fillet-poster" href="#fillet-poster" data-project-card>
              <img src="/c6.jpg" alt="fillet poster">
              <h2>fillet poster</h2>
            </a>
            <a class="thumbnail-card thumbnail-card--duo" id="cotton-lace-big-pouch" href="#cotton-lace-big-pouch" data-project-card>

            </a>
            <a class="thumbnail-card thumbnail-card--duo" id="black-mini-cross-bag" href="#black-mini-cross-bag" data-project-card>

              <img src="/c8-2.jpg" alt="">
              <h2>black mini cross-bag</h2>
            </a>
            <a class="thumbnail-card" id="star" href="#star" data-project-card>
              <img src="/c9.jpg" alt="star cross-bag">
              <h2>star cross-bag</h2>
            </a>
            <a class="thumbnail-card" id="mini-tote-bag" href="#mini-tote-bag" data-project-card>
              <img src="/c10.jpg" alt="mini tote bag">
              <h2>mini tote bag</h2>
            </a>
          </div>
          <div class="project-pagination" aria-label="Project pages">
            <button type="button" class="project-page-btn" data-project-page-action="prev">Prev</button>
            <span class="project-page-info">1 / 1</span>
            <button type="button" class="project-page-btn" data-project-page-action="next">Next</button>
